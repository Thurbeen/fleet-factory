default_stages: [pre-commit]
default_install_hook_types:
  - commit-msg
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: cocogitto-verify
        name: Verify conventional commit message
        entry: cog verify
        language: system
        stages: [commit-msg]
        args: ['--file']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.4
    hooks:
      - id: rumdl-check

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        files: \.(ts|json)$
      - id: prettier
        name: prettier
        entry: pnpm fmt:check
        language: system
        pass_filenames: false
        files: \.(ts|json|ya?ml)$
      - id: test
        name: test
        entry: pnpm test
        language: system
        pass_filenames: false
        files: \.(ts|json)$
