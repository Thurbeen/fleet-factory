---
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  FLEET_VERSION: 3.1.0

jobs:
  supersede:
    name: Supersede older heads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this workflow's active runs of an older head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/actions/runs" -X GET \
            -f event=pull_request -f branch="$HEAD_REF" -f per_page=100 \
            | jq -r --arg workflow "$WORKFLOW" --arg repo "$HEAD_REPO" \
                --arg head "$HEAD_SHA" --argjson run "$RUN_ID" '.workflow_runs[]
                | select(.name == $workflow and .head_repository.full_name == $repo)
                | select(.head_sha != $head and .id < $run)
                | select(.status | IN("queued", "pending", "waiting", "requested", "in_progress"))
                | "\(.id) \(.head_sha)"' \
            | while read -r id sha; do
                if gh run cancel "$id" --repo "$REPO"; then
                  echo "cancelled run $id of head $sha"
                else
                  echo "could not cancel run $id of head $sha"
                fi
              done

  plugin:
    name: Plugin (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Download the pinned Fleet release and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/fleet" && cd "$RUNNER_TEMP/fleet"
          asset="thurbox-v${FLEET_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          sums="thurbox-${FLEET_VERSION}-sha256sums.txt"
          gh release download "v$FLEET_VERSION" -R Thurbeen/thurbox -p "$asset" -p "$sums"
          grep " $asset\$" "$sums" | sha256sum -c -
          tar xzf "$asset" fleet
          echo "FLEET_BIN=$RUNNER_TEMP/fleet/fleet" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm fmt:check
      - run: pnpm test
        env:
          FLEET_E2E_REQUIRED: '1'
      - name: The plugin runs without a build or a dependency
        run: |
          echo '{"protocol":1,"plugin":"fleet-factory","id":"m"}' \
            | node src/plugin.ts manifest | grep -q '"ok":true'

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rvben/rumdl@0d3d6e4f07c585a9433df162949ca0fe280a40dd # v0.3.4
        with:
          report-type: annotations

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

  all-checks:
    name: All Checks
    if: always()
    needs:
      - plugin
      - markdown-lint
      - shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
