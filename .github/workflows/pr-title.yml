---
name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  supersede:
    name: Supersede older heads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this workflow's active runs of an older head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run list --repo "$REPO" --workflow "$WORKFLOW" --branch "$HEAD_REF" \
            --event pull_request --limit 100 --json databaseId,headSha,status \
            | jq -r --arg head "$HEAD_SHA" --argjson run "$RUN_ID" '.[]
                | select(.headSha != $head and .databaseId < $run)
                | select(.status | IN("queued", "pending", "waiting", "requested", "in_progress"))
                | "\(.databaseId) \(.headSha)"' \
            | while read -r id sha; do
                if gh run cancel "$id" --repo "$REPO"; then
                  echo "cancelled run $id of head $sha"
                else
                  echo "could not cancel run $id of head $sha"
                fi
              done

  pr-title:
    name: PR Title
    if: github.event.action != 'edited' || github.event.changes.title != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/check-pr-title.sh "$PR_TITLE" "$PR_NUMBER"
